[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dairyvision-ml-engine"
version = "0.1.0"
description = "Machine Learning, Explainability & Digital Twin Analytics Engine for DairyVision AI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "joblib>=1.3.0",
    "requests>=2.28.0",
]

[tool.setuptools]
package-dir = {"ml_engine" = "."}
packages = ["ml_engine"]
